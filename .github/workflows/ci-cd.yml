name: Iris MLOps CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Run Python Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-pythons@v5
              with:
                python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                version: "0.12.12"
                enable-cache: true

            - name: Install dependencies
              run: uv sync --locked
            
            - name: Ryn pytest
              run: uv run pytest -v
              




